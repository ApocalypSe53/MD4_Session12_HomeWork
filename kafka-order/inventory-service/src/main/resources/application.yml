server:
  port: 8083

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: 3                       # 1 thread / partition (topic có 3 partition)
    consumer:
      group-id: inventory-service          # group riêng -> nhận MỌI event, độc lập với email-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.rikkei.inventoryservice.event.OrderCreatedEvent

app:
  kafka:
    topic:
      order-events: order-events
  inventory:
    # Giả lập nghiệp vụ trừ kho chậm (gọi kho vật lý, ERP...)
    simulated-latency: 1s
