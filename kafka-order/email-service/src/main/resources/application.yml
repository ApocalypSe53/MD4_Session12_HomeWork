server:
  port: 8082

spring:
  application:
    name: email-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: 3                       # 1 thread / partition (topic có 3 partition)
    consumer:
      group-id: email-service              # group riêng -> nhận MỌI event, độc lập với inventory-service
      auto-offset-reset: earliest          # group mới đọc từ đầu topic, không bỏ sót đơn đặt trước khi service lên
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: JSON hỏng không làm consumer kẹt vòng lặp vô hạn
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.rikkei.emailservice.event.OrderCreatedEvent

app:
  kafka:
    topic:
      order-events: order-events
  email:
    # Giả lập thời gian gọi SMTP server
    simulated-latency: 2s
