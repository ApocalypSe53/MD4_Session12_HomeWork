server:
  port: ${PORT:8095}

spring:
  application:
    name: promotion-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/shop
    username: shop
    password: shop
  jpa:
    hibernate:
      ddl-auto: none          # schema do db/init.sql quản lý
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6382}

app:
  pubsub:
    channel: promotion-updates
